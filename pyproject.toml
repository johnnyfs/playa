[project]
name = "hrl-poc"
version = "0.1.0"
description = "Phase 1 hierarchical RL skill-learning proof of concept."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "torch>=2.2.0",
]

[project.scripts]
ladder = "hrl_poc.ladder.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hrl_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
